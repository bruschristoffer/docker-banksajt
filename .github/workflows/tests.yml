name: Tester & Deploy

on:
  push:
    branches: ["main", "CI/CD", "Playwrite-och-Vitest"]
  pull_request:
    branches: ["main", "CI/CD", "Playwrite-och-Vitest"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Godkänd nivå (Tester)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Hämta repository
        uses: actions/checkout@v4

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kontrollera projektstruktur
        shell: bash
        run: |
          test -f frontend/package.json || { echo "frontend/package.json saknas"; exit 1; }
          test -f frontend/package-lock.json || { echo "frontend/package-lock.json saknas"; exit 1; }
          test -f backend/package.json || { echo "backend/package.json saknas"; exit 1; }
          test -f backend/package-lock.json || { echo "backend/package-lock.json saknas"; exit 1; }

      - name: Installera beroenden
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          if [ -d "tests" ]; then npm ci --prefix tests; fi

      - name: Kör Vitest enhetstester (Backend)
        run: npm test --prefix backend

      - name: Starta applikationsmiljö med Docker Compose
        run: |
          docker compose down -v
          docker compose up -d --build

      - name: Vänta på att frontend och backend startar
        run: |
          timeout 60 bash -c 'until curl -s http://127.0.0.1:3000 > /dev/null; do sleep 2; done' || exit 1

      - name: Kör skolans tester
        run: |
          if [ -d "tests" ]; then
            npx --prefix tests playwright install --with-deps chromium
            npm test --prefix tests
          fi

      - name: Kör Playwright E2E-tester i frontend
        run: |
          npx --prefix frontend playwright install --with-deps chromium
          npm run test:e2e --prefix frontend

      - name: Stäng ner Docker Compose
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to EC2
    needs: test-and-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Run Docker on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/docker-banksajt
            git fetch origin
            git checkout Playwrite-och-Vitest
            git pull origin Playwrite-och-Vitest
            sudo docker compose down -v
            sudo docker compose up -d --build
